# 운영 EC2용(#386). 로컬 개발 DB는 루트 docker-compose.yml이다.
# deploy.sh가 실행한다. 이미지 주소(BACKEND_IMAGE, AI_IMAGE)는 deploy.sh가 /opt/moeun/runtime/compose.env에 적는다.
# 손으로 볼 때: docker compose --env-file /opt/moeun/runtime/compose.env -f /opt/moeun/repo/deploy/docker-compose.yml ps
# 실행 중 생기는 파일(env, ETF 가격, 로그)은 저장소 밖 /opt/moeun/runtime에 두고 절대경로로 참조한다.
# env_file은 format: raw로 읽는다(비밀번호의 $·따옴표를 그대로 둔다). Docker Compose 2.30 이상이 필요하다
name: moeun

# 컨테이너 stdout 로그(json-file)는 기본이 무제한이다. 디스크를 지키려고 서비스마다 10MB × 3개로 묶는다
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  backend:
    image: ${BACKEND_IMAGE:?deploy.sh가 compose.env에 적는다}
    env_file:
      - path: /opt/moeun/runtime/backend.env
        format: raw
    environment:
      AI_SERVER_URL: http://ai-server:8000
      LOG_DIR: /app/logs
    volumes:
      - /opt/moeun/runtime/data/seed:/app/data/seed:ro   # ETF 가격 CSV(사람이 올린다, docs/deploy.md)
      - /opt/moeun/runtime/logs/backend:/app/logs
    mem_limit: 1g
    restart: unless-stopped
    logging: *logging
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 120s

  ai-server:
    image: ${AI_IMAGE:?deploy.sh가 compose.env에 적는다}
    env_file:
      - path: /opt/moeun/runtime/ai.env
        format: raw
    environment:
      SPRING_BASE_URL: http://backend:8080
      LOG_DIR: /repo/ai-server/logs
    volumes:
      - /opt/moeun/runtime/logs/ai-server:/repo/ai-server/logs
    mem_limit: 512m
    restart: unless-stopped
    logging: *logging
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s

  # 외부에 여는 것은 nginx뿐이다. ai-server와 backend의 /internal/**은 compose 내부망에서만 닿는다
  nginx:
    image: nginx:1.28-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # 파일 하나가 아니라 폴더째 마운트한다. git checkout이 파일을 새로 만들어도 컨테이너가 새 파일을 본다
      - ./nginx:/etc/nginx/conf.d:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro   # 호스트 certbot이 발급·갱신한다(docs/deploy.md)
    depends_on:
      - backend
    restart: unless-stopped
    logging: *logging
