# 운영 nginx(#386). 도메인 moeun-api.duckdns.org(#406). 바꾸면 인증서 경로와 frontend/vercel.json도 같이 바꾼다
# 공개하는 것: /api/**(Vercel rewrites가 넘긴다), /actuator/health. 나머지(/internal/**, /docs/**, /webjars/**, actuator)는 404

server {
    listen 80;
    server_name moeun-api.duckdns.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name moeun-api.duckdns.org;

    ssl_certificate     /etc/letsencrypt/live/moeun-api.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/moeun-api.duckdns.org/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 1m;

    # backend 컨테이너가 다시 만들어지면 IP가 바뀐다. Docker DNS로 매 요청 다시 찾는다(배포 뒤 502 방지)
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:8080;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /api/ {
        proxy_pass $backend;
        proxy_read_timeout 60s;
    }

    location = /actuator/health {
        proxy_pass $backend;
    }

    location / {
        return 404;
    }
}
