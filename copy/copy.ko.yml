# 문구표(CP-05). Spring·ai-server·프론트가 같은 파일을 읽는다. 고정 문구는 여기에만 둔다.
#
# 규칙
# - 문체는 해요체. 면책(disclaimer)만 격식체 문장을 섞는다. 금지 표현은 CF-07을 따른다(테스트가 검사한다).
# - 키는 중첩 YAML이고 로더가 '.'으로 이어 붙여 읽는다(excluded.EXCHANGE_RATE).
#   같은 이름이 문장이면서 묶음일 수 없는 outOfScope와 outOfScope.tax만 따옴표 친 평탄 키로 쓴다.
# - 값은 따옴표 친 문자열로 쓴다(따옴표 없는 true 같은 값은 두 로더가 다르게 읽는다).
# - 자리 표시자는 {이름}이다. 이름은 영문자·숫자·밑줄만 쓴다. 값이 빠지면 로더가 실패한다. 없는 키·빈 값·중복 키도 로드 실패다.
# - '임시'는 전문가·팀 확인 전 문장이다. 확정되면 이 표시를 지운다.
# - 키 이름을 바꾸면 계약 표(C12a-7-1, H-15)와 #47~#54 본문을 함께 고친다.

# 범위 밖 안내(일반)와 범위 밖 세금 질문 안내(D-073, 임시)
"outOfScope": "이 질문은 모은에서 다루지 않아요. 목표 달성 시뮬레이션과 관련된 질문을 해 주세요."
"outOfScope.tax": "상품별 세제 혜택, 개인 세금 계산, 절세 방법은 모은에서 다루지 않아요. 정확한 내용은 금융기관이나 세무 전문가에게 확인해 주세요."

# 면책·고지(D-066). 결과 화면 면책(FR-RES-07)과 대화창 고지가 같은 키 하나다(임시)
disclaimer: "이 서비스의 결과는 과거 데이터를 바탕으로 한 시뮬레이션이며 미래의 수익을 보장하지 않습니다. AI 설명은 참고용이며 계산 결과가 기준이에요."

# 세금 단서(D-067, 임시)
tax:
  note: "세금은 일반 과세를 기준으로 가정했어요. 비과세·세금우대 상품, 금융소득, 세법이 바뀌면 달라질 수 있어요. 정확한 세금은 금융기관이나 세무 전문가에게 확인해 주세요."

