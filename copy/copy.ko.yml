chat:
  # 대화로 못 바꾸는 조건 안내(D-056, D-090). 범위 밖 안내(outOfScope)와 다른 키다
  unchangeableCondition: "목표 종류·기존 납입액은 여기서 바꿀 수 없어요. 보유 자산은 입력 수정에서 바꿀 수 있어요."
  noPlan: "먼저 목표와 조건을 입력해 계획을 만들어 주세요"
