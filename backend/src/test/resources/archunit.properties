# ArchitectureTests의 FreezingArchRule이 기존 위반을 기록하는 곳(커밋한다)
freeze.store.default.path=src/test/resources/archunit_store
# 위반이 줄면 저장소에서 지운다. 새 위반은 저장하지 않고 실패한다
freeze.store.default.allowStoreUpdate=true
# 저장소 폴더가 없으면 실패한다(커밋된 저장소만 쓴다). 저장소 키 확인은 ArchitectureTests가 한다
freeze.store.default.allowStoreCreation=false
